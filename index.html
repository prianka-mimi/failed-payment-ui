<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed - Ultra Premium UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0A0A0B;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0,0,0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        
        .animate-blob { animation: blob 10s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(40px, -60px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        
        .glow-text { text-shadow: 0 0 25px rgba(244, 63, 94, 0.6); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Ambient Soft Glowing Background -->
    <div class="absolute top-1/4 left-1/4 w-[28rem] h-[28rem] bg-rose-600/10 rounded-full mix-blend-screen filter blur-[120px] animate-blob"></div>
    <div class="absolute top-1/3 right-1/4 w-[28rem] h-[28rem] bg-purple-600/10 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-32 left-1/2 w-[28rem] h-[28rem] bg-red-700/10 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-4000"></div>

    <!-- Main Glassmorphism Card -->
    <div class="glass-card max-w-md w-full rounded-[2.5rem] p-10 relative z-10 text-center transform transition-all hover:scale-[1.02] duration-500">
        
        <!-- Elegant Glowing Icon -->
        <div class="relative w-24 h-24 mx-auto mb-8">
            <div class="absolute inset-0 bg-rose-500/20 rounded-full animate-ping" style="animation-duration: 3s;"></div>
            <div class="relative w-full h-full bg-gradient-to-tr from-rose-500 to-red-400 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(244,63,94,0.3)] border border-rose-300/40">
                <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </div>
        </div>

        <h2 class="text-3xl font-extrabold text-white mb-3 tracking-tight glow-text">Payment Failed</h2>
        <p class="text-gray-400 mb-8 text-sm leading-relaxed font-medium">Your transaction couldn't be completed. Don't worry, your card hasn't been charged.</p>

        <!-- Premium Transaction Details Box -->
        <div class="bg-black/30 rounded-[1.5rem] p-5 mb-8 border border-white/5 backdrop-blur-md">
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-white/5">
                <span class="text-sm font-medium text-gray-400">Amount Due</span>
                <span class="text-xl font-bold text-rose-400">$299.00</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-gray-500">Transaction ID</span>
                <span class="text-sm font-mono font-semibold text-gray-300">TXN-8472910</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-4">
            <button class="w-full bg-white text-black hover:bg-gray-100 font-bold py-4 px-6 rounded-2xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(255,255,255,0.15)] focus:outline-none focus:ring-4 focus:ring-white/30 text-base">
                Try Payment Again
            </button>
            
            <!-- Target URL Added Here -->
            <a href="https://dashboard.stripe.com/acct_1TH0MqGXCULCvG3r/test/payments" target="_blank" class="w-full flex items-center justify-center bg-transparent text-gray-300 hover:text-white font-semibold py-4 px-6 rounded-2xl border border-gray-700 hover:border-gray-400 hover:bg-white/5 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-gray-600 text-base group">
                <span>Contact Support</span>
                <svg class="w-4 h-4 ml-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
            </a>
        </div>
    </div>
</body>
</html>
