<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed - Clean Premium UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F8FAFC;
        }
        
        /* Premium Soft Shadow */
        .card-shadow { 
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0,0,0,0.02); 
        }
        
        /* Subtle Ripple Animation for Icon */
        .ripple-wrapper { position: relative; }
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #F43F5E;
            animation: ripple-anim 2.5s cubic-bezier(0.15, 0.85, 0.35, 1.2) infinite;
            opacity: 0;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
        }
        .ripple-2 { animation-delay: 1.2s; }
        
        @keyframes ripple-anim {
            0% { transform: scale(0.8); opacity: 0.4; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        /* Smooth Slide Up Entrance */
        .slide-up { 
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            opacity: 0; 
            transform: translateY(20px); 
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        
        @keyframes slideUp { 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:24px_24px]">
    
    <div class="max-w-md w-full bg-white rounded-[2rem] p-10 relative z-10 text-center card-shadow slide-up">
        
        <!-- Elegant Minimalist Icon -->
        <div class="relative w-20 h-20 mx-auto mb-8 flex items-center justify-center ripple-wrapper">
            <div class="ripple"></div>
            <div class="ripple ripple-2"></div>
            <div class="relative z-10 w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center shadow-sm border border-rose-100">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
        </div>

        <!-- Clean Typography -->
        <h2 class="text-2xl font-bold text-gray-900 mb-3 slide-up delay-1 tracking-tight">Payment Failed</h2>
        <p class="text-gray-500 mb-8 text-sm leading-relaxed slide-up delay-1 font-medium px-2">We couldn't process your payment. Please check your card details or try a different payment method.</p>

        <!-- Neumorphic Details Box -->
        <div class="bg-gray-50 rounded-[1.25rem] p-5 mb-8 border border-gray-100 slide-up delay-2">
            <div class="flex justify-between items-center mb-3 pb-3 border-b border-gray-200/60">
                <span class="text-sm font-medium text-gray-500">Amount Due</span>
                <span class="text-lg font-bold text-gray-900">---</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-gray-500">Transaction ID</span>
                <span class="text-xs font-mono font-semibold text-gray-600 bg-white px-2.5 py-1.5 rounded-md border border-gray-200 shadow-sm">TXN----</span>
            </div>
        </div>

        <!-- Premium Action Buttons -->
        <div class="space-y-3 slide-up delay-2">
            <button class="w-full bg-gray-900 text-white hover:bg-black font-semibold py-4 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-gray-900/15 active:scale-[0.98] flex items-center justify-center space-x-2">
                <span>Try Payment Again</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            </button>
            
            <a href="https://dashboard.stripe.com/acct_1TH0MqGXCULCvG3r/test/payments" target="_blank" class="w-full flex items-center justify-center bg-white text-gray-600 hover:text-gray-900 font-semibold py-4 px-6 rounded-xl border border-gray-200 hover:border-gray-300 hover:bg-gray-50 transition-all duration-200 active:scale-[0.98]">
                Contact Support
            </a>
        </div>
    </div>
    
</body>
</html>
